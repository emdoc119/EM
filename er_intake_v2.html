<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>응급실 사전 접수</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBVG_OjJOFQjyg849-A4b7rXvrZbIeouAQ",
            authDomain: "er-ktas-app.firebaseapp.com",
            databaseURL: "https://er-ktas-app-default-rtdb.firebaseio.com",
            projectId: "er-ktas-app",
            storageBucket: "er-ktas-app.firebasestorage.app",
            messagingSenderId: "705354123132",
            appId: "1:705354123132:web:0ee004e5ae91f9f1a546f9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window._fb = { db, ref, set, push };
        window.dispatchEvent(new Event('fb-ready'));
    </script>

    <style>
        :root{--navy:#1a3a5c;--blue:#2471a3;--lb:#bee3f8;--green:#1e8449;--red:#e74c3c;--orange:#f39c12;--sub:#888}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f0f6ff,#e8f0f8,#ddeaf7);min-height:100vh;padding-bottom:60px}
        .hdr{background:linear-gradient(135deg,#1a3a5c,#0f2740);padding:18px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(15,39,64,.25);position:sticky;top:0;z-index:100}
        .hdr-icon{width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
        .hdr-t{color:#fff;font-size:17px;font-weight:700}
        .hdr-s{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px}
        .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
        .steps{display:flex;align-items:center;justify-content:center;padding:16px 20px 8px}
        .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
        .dot{width:28px;height:28px;border-radius:50%;background:#dde3ec;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#999;transition:all .3s}
        .dot.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(26,58,92,.3)}
        .dot.dn{background:var(--green);color:#fff}
        .slbl{font-size:10px;color:#aaa;font-weight:500;white-space:nowrap}
        .slbl.on{color:var(--navy);font-weight:700}
        .sline{flex:1;height:2px;background:#dde3ec;margin-bottom:18px;max-width:40px}
        .sline.dn{background:var(--green)}
        .wrap{max-width:480px;margin:0 auto;padding:8px 16px 0}
        .sc{background:#fff;border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 16px rgba(26,58,92,.08);border:1px solid #e8f0f8}
        .sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
        .si{width:38px;height:38px;background:linear-gradient(135deg,#e8f4fd,#d6eaf8);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
        .st{font-size:15px;font-weight:700;color:var(--navy)}
        .ss{font-size:12px;color:var(--sub)}
        .ur{display:flex;gap:10px}
        .ub{flex:1;padding:12px 8px;border-radius:12px;background:linear-gradient(135deg,#f0f6ff,#e8f0f8);border:1.5px dashed #90bce8;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
        .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
        .chip{background:#e8f4fd;border:1px solid var(--lb);border-radius:20px;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
        .chip img{width:20px;height:20px;border-radius:4px;object-fit:cover}
        .exs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
        .ec{background:#fff;color:var(--navy);border:1.5px solid var(--lb);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer}
        .ec.on{background:var(--navy);color:#fff;border-color:var(--navy)}
        .rw{position:relative}
        textarea{width:100%;border:1.5px solid var(--lb);border-radius:12px;padding:12px 48px 12px 14px;font-size:14px;resize:none;outline:none;font-family:inherit}
        .mb{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--navy);border:none;cursor:pointer;color:#fff}
        .mb.ls{background:var(--red);animation:pr 1s infinite}
        .sbtn{width:100%;padding:18px;border-radius:16px;background:linear-gradient(135deg,#1a3a5c,#2471a3);border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(26,58,92,.35)}
        #ps, #rs, #qs{display:none;padding:20px 0}
        .pstep{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:14px;color:#555}
        .pstep.dn{color:var(--green);font-weight:700}
        .sp{width:16px;height:16px;border:2px solid #e0e0e0;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin-left:auto}
        @keyframes sp{to{transform:rotate(360deg)}}
        @keyframes pr{0%{box-shadow:0 0 0 0 rgba(231,76,60,0.4)}100%{box-shadow:0 0 0 8px rgba(231,76,60,0)}}
        .qcard{background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 8px 32px rgba(26,58,92,.12);border:2px solid var(--lb)}
        #qrcode{display:flex;justify-content:center;margin:15px 0}
    </style>
</head>
<body>

<div class="hdr">
    <div class="hdr-icon">🏥</div>
    <div><div class="hdr-t">응급실 사전 접수</div><div class="hdr-s">Emergency Department Pre-Registration</div></div>
    <div class="badge">EMERGENCY</div>
</div>

<div class="steps">
    <div class="step"><div class="dot on" id="d1">1</div><div class="slbl on" id="l1">정보입력</div></div>
    <div class="sline" id="ln1"></div>
    <div class="step"><div class="dot" id="d2">2</div><div class="slbl" id="l2">AI분석</div></div>
    <div class="sline" id="ln2"></div>
    <div class="step"><div class="dot" id="d3">3</div><div class="slbl" id="l3">요약확인</div></div>
    <div class="sline" id="ln3"></div>
    <div class="step"><div class="dot" id="d4">4</div><div class="slbl" id="l4">QR전달</div></div>
</div>

<div class="wrap">
    <div id="main">
        <div class="sc">
            <div class="sh"><div class="si">📄</div><div><div class="st">의료 서류 사진</div><div class="ss">소견서 · 의뢰서 · 검사지</div></div></div>
            <input type="file" id="mc1" accept="image/*" capture="environment" multiple style="display:none">
            <div class="ur">
                <button class="ub" onclick="document.getElementById('mc1').click()">📷 사진 촬영 / 앨범 선택</button>
            </div>
            <div class="chips" id="mchips"></div>
        </div>
        
        <div class="sc">
            <div class="sh"><div class="si">💊</div><div><div class="st">복용 중인 약</div><div class="ss">약봉투 · 처방전</div></div></div>
            <input type="file" id="rc1" accept="image/*" capture="environment" multiple style="display:none">
            <div class="ur">
                <button class="ub" onclick="document.getElementById('rc1').click()">💊 약봉투 촬영 / 선택</button>
            </div>
            <div class="chips" id="rchips"></div>
        </div>

        <div class="sc">
            <div class="sh"><div class="si">💬</div><div class="st">오늘 응급실에 오신 이유</div></div>
            <div class="exs">
                <button class="ec" onclick="setEx(this)">너무 아파서 통증 조절이 필요해서</button>
                <button class="ec" onclick="setEx(this)">머리가 아파 뇌졸중이 걱정되어서</button>
                <button class="ec" onclick="setEx(this)">숨이 차고 가슴이 아파서</button>
            </div>
            <div class="rw">
                <textarea id="reason" rows="4" placeholder="증상과 발생 시간을 적어주세요."></textarea>
                <button class="mb" id="micbtn" onclick="togMic()">🎤</button>
            </div>
        </div>
        <button class="sbtn" onclick="doSubmit()">🤖 AI 분석 후 의사에게 전달</button>
    </div>

    <div id="ps">
        <h2 style="text-align:center; color:var(--navy); margin-bottom:10px">AI 분석 중...</h2>
        <div class="sc">
            <div class="pstep" id="ps1">📄 사진 텍스트 추출 (OCR)</div>
            <div class="pstep" id="ps2">🧠 의료 정보 요약 생성</div>
            <div class="pstep" id="ps3">☁️ 서버 저장 및 데이터화</div>
        </div>
    </div>

    <div id="rs">
        <div class="sc">
            <h3 style="color:var(--navy); margin-bottom:12px">🩺 환자 정보 요약</h3>
            <div id="summaryContent" style="font-size:14px; line-height:1.6; color:#333"></div>
        </div>
        <button class="sbtn" onclick="doQR()">📤 QR 코드 생성</button>
    </div>

    <div id="qs">
        <div class="qcard">
            <div class="st">📱 의사용 QR 코드</div>
            <div id="qrcode"></div>
            <div id="rno" style="font-weight:700; color:var(--navy)"></div>
        </div>
        <button class="sbtn" style="margin-top:20px; background:var(--green)" onclick="location.reload()">처음으로 돌아가기</button>
    </div>
</div>

<script>
    // --- 설정 ---
    const GKEY = 'AIzaSyAogxTcfOA0ag8ZgGdTbLJmuchxp8uyoqA';
    const DRBASE = 'https://emdoc119.github.io/EM/er_doctor.html';
    
    let mf = [], rf = [], mocrT = '', rocrT = '', aiD = null, pid = null, listening = false;
    const REC = 'ER-' + String(Date.now()).slice(-6);

    // --- 파일 처리 ---
    document.getElementById('mc1').addEventListener('change', e => addFiles(e.target.files, mf, 'mchips'));
    document.getElementById('rc1').addEventListener('change', e => addFiles(e.target.files, rf, 'rchips'));

    function addFiles(files, arr, cid) {
        Array.from(files).forEach(f => {
            const u = URL.createObjectURL(f);
            arr.push({ name: f.name, url: u, file: f });
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `<img src="${u}"> <span>${f.name.slice(0,10)}...</span>`;
            document.getElementById(cid).appendChild(chip);
        });
    }

    function setEx(b) {
        document.querySelectorAll('.ec').forEach(c => c.classList.remove('on'));
        b.classList.add('on');
        document.getElementById('reason').value = b.textContent;
    }

    // --- 음성 인식 ---
    let recognition;
    function togMic() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert('지원되지 않는 브라우저입니다.'); return; }
        if (listening) { recognition.stop(); return; }

        recognition = new SR();
        recognition.lang = 'ko-KR';
        recognition.onstart = () => {
            listening = true;
            document.getElementById('micbtn').classList.add('ls');
            document.getElementById('micbtn').textContent = '⏹';
        };
        recognition.onresult = e => {
            document.getElementById('reason').value = e.results[0][0].transcript;
        };
        recognition.onend = () => {
            listening = false;
            document.getElementById('micbtn').classList.remove('ls');
            document.getElementById('micbtn').textContent = '🎤';
        };
        recognition.start();
    }

    // --- AI API 호출 (2026 최신 Flash 모델 사용) ---
    async function callGemini(prompt, isVision = false, base64 = null, mime = null) {
        const model = "gemini-1.5-flash"; // 속도와 정확도 밸런스가 가장 좋은 모델
        const url = `https://generativelanguage.googleapis.com/v1/models/${model}:generateContent?key=${GKEY}`;
        
        let contents = [{ role: "user", parts: [{ text: prompt }] }];
        if (isVision && base64) {
            contents[0].parts.unshift({ inline_data: { mime_type: mime, data: base64 } });
        }

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'AI Error');
        return data.candidates[0].content.parts[0].text;
    }

    async function f2b64(f) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); }); }

    // --- 메인 프로세스 ---
    async function doSubmit() {
        const reason = document.getElementById('reason').value.trim();
        if (!reason && !mf.length && !rf.length) { alert('내용을 입력해 주세요.'); return; }

        showScr('ps');
        updatePStep('ps1', '진행 중');

        try {
            // OCR (첫 번째 서류만 예시로 수행)
            if (mf.length) {
                const b64 = await f2b64(mf[0].file);
                mocrT = await callGemini("이 서류의 텍스트를 모두 읽어주세요.", true, b64, mf[0].file.type);
            }
            updatePStep('ps1', '완료');
            
            updatePStep('ps2', '진행 중');
            const summaryPrompt = `응급실 의사용 환자 요약문 작성 (JSON 형식 제외, 가독성 좋게): 
            내원이유: ${reason}, 서류내용: ${mocrT}`;
            const summary = await callGemini(summaryPrompt);
            document.getElementById('summaryContent').innerText = summary;
            updatePStep('ps2', '완료');

            updatePStep('ps3', '진행 중');
            if (window._fb) {
                const { db, ref, push, set } = window._fb;
                const newRef = push(ref(db, 'patients'));
                await set(newRef, { id: REC, reason, summary, timestamp: new Date().toISOString() });
                pid = newRef.key;
            }
            updatePStep('ps3', '완료');

            setStep(3);
            showScr('rs');
        } catch (e) {
            alert('오류 발생: ' + e.message);
            location.reload();
        }
    }

    function updatePStep(id, status) {
        const el = document.getElementById(id);
        if (status === '진행 중') el.innerHTML += '<span class="sp"></span>';
        else {
            el.classList.add('dn');
            el.innerHTML = '✅ ' + el.innerText.replace('진행 중', '');
        }
    }

    function showScr(id) {
        ['main', 'ps', 'rs', 'qs'].forEach(s => document.getElementById(s).style.display = s === id ? 'block' : 'none');
        window.scrollTo(0,0);
    }

    function setStep(n) {
        for (let i = 1; i <= 4; i++) {
            const d = document.getElementById('d' + i);
            if (d) d.className = 'dot' + (i < n ? ' dn' : i === n ? ' on' : '');
        }
    }

    function doQR() {
        setStep(4);
        showScr('qs');
        const url = `${DRBASE}?id=${pid}`;
        new QRCode(document.getElementById('qrcode'), { text: url, width: 200, height: 200, colorDark: '#1a3a5c' });
        document.getElementById('rno').textContent = '접수 번호: ' + REC;
    }
</script>
</body>
</html>
